name: Test, Build & Deploy
 
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
 
env:
  CARGO_TERM_COLOR: always
 
jobs:
  # ═══════════════════════════════════════════════════
  # Stage 1: Run all tests
  # ═══════════════════════════════════════════════════
  test:
    name: Test
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      # --- Backend Tests ---
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
 
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
 
      - name: Install SQLite dev libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
 
      - name: Run backend tests
        run: cargo test --bin blog_backend
        env:
          SQLX_OFFLINE: true
 
      # --- Frontend Tests ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
 
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
 
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
 
  # ═══════════════════════════════════════════════════
  # Stage 2: Build Rust backend for ARM
  # Only runs if tests pass
  # Only runs on push to master (not on PRs)
  # ═══════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
 
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
 
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libsqlite3-dev
 
      - name: Configure Cargo for cross-compilation
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
 
      - name: Build backend (ARM release)
        run: cargo build --release --target aarch64-unknown-linux-gnu --bin blog_backend
        env:
          SQLX_OFFLINE: true
 
      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: target/aarch64-unknown-linux-gnu/release/blog_backend
          retention-days: 1
 
  # ═══════════════════════════════════════════════════
  # Stage 3: Deploy to EC2
  # Ships backend binary + frontend source to server
  # Builds frontend on the server
  # ═══════════════════════════════════════════════════
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: ./backend
 
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
 
      - name: Deploy backend binary
        run: |
          scp -i ~/.ssh/deploy_key \
            ./backend/blog_backend \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/blog/blog_backend_new
 
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            chmod +x /opt/blog/blog_backend_new
            mv /opt/blog/blog_backend_new /opt/blog/blog_backend
            sudo systemctl restart blog-backend
          EOF
 
      - name: Deploy and build frontend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude node_modules \
            --exclude .next \
            --exclude .env.local \
            ./frontend/ \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/blog/frontend/
 
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            cd /opt/blog/frontend
            echo "NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_URL }}" > .env.local
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.PUBLIC_URL }}" >> .env.local
            npm ci
            npm run build
            sudo systemctl restart blog-frontend
          EOF
 
      - name: Health check
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} \
            "curl -sf http://localhost:3001/api/health || echo 'Backend health check failed!'"
 
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key